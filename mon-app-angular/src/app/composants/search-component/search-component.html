<div class="search-container">
    <h2>Recherche de Produits</h2>

    <app-search-input-component [searchLabel]="'Rechercher un produit'"
        (search)="applyFilter($event)"></app-search-input-component>

    @if(loading()){
    <mat-spinner></mat-spinner>
    }

    <div>
        <span>Nombre de produits trouvés : {{ produitsAffiches().length }}</span>
    </div>

    <section class="flex gap-4 flex-col">
        @for(produit of produitsAffiches(); track produit.id){
        <div class="flex gap-4">
            <div>{{ produit.id }}</div>
            <div>{{ produit.nom }}</div>
            <div>{{ produit.categorie }}</div>
        </div>
        }
        @empty {
        Aucun produit trouvé.
        }
    </section>
</div>
