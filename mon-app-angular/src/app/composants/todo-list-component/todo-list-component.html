<h1>Liste des todos : ({{ todosTermines()}}/{{nombreTodos() }} terminés)</h1>
<a matButton [routerLink]="['/todo-list/nouveau']">Ajouter un todo</a>
<section>
    <table mat-table [dataSource]="todoList()" class="mat-elevation-z8">
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> Id</th>
            <td mat-cell *matCellDef="let todo"> {{todo.id}} </td>
        </ng-container>
        <ng-container matColumnDef="nom">
            <th mat-header-cell *matHeaderCellDef> Nom</th>
            <td mat-cell *matCellDef="let todo"> {{todo.titre | maxLength:20}} </td>
        </ng-container>
        <ng-container matColumnDef="termine">
            <th mat-header-cell *matHeaderCellDef> Terminé ?</th>
            <td mat-cell *matCellDef="let todo"> <mat-checkbox [(ngModel)]="todo.termine"
                    (change)="modifierTodo(todo)"></mat-checkbox> </td>
        </ng-container>
        <ng-container matColumnDef="commands">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let todo"> <button matButton type="button"
                    (click)="supprimerTodo(todo)">Supprimer</button> </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['id', 'nom', 'termine', 'commands']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['id', 'nom', 'termine', 'commands'];"></tr>
    </table>
</section>
