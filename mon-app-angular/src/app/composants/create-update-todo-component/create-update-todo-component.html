<form class="flex flex-col items-start" (ngSubmit)="ajouterTodo()">
    <mat-form-field>
        <mat-label>{{ estEnModification() ? "Modifier le todo" : "Ajouter un todo"}} </mat-label>
        <input matInput name="nom" placeholder="Nom du todo..." type="text" [ngModel]="todo()?.titre" (ngModelChange)="titre = $event">
    </mat-form-field>

    <button matButton="filled" [disabled]="titre.length === 0">
        {{ estEnModification() ? "Modifier" : "Ajouter" }}
    </button>
</form>
