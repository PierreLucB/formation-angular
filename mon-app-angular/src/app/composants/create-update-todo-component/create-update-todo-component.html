<form class="flex flex-col items-start" (ngSubmit)="ajouterTodo()">
    <mat-form-field>
        <mat-label>Ajouter un todo</mat-label>
        <input matInput name="nom" placeholder="Nom du todo..." type="text" [(ngModel)]="nouveauTodo">
    </mat-form-field>

    <button matButton="filled" [disabled]="nouveauTodo.length === 0">Ajouter</button>
</form>
